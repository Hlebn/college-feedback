<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оценка направлений</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #0b0f19;
      --bg-card: #141b2d;
      --bg-input: #1a233a;
      --primary-blue: #3b66f5;
      --primary-hover: #2d52d9;
      --text-main: #f1f5f9;
      --text-muted: #8e9bb2;
      --border-color: #263352;
      --border-focus: #3b66f5;
      --radius-pill: 9999px;
      --radius-card: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--bg-page);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Баннер */
    .banner {
      background: #18223c;
      border: 1px solid #2a3b66;
      color: #e2e8f0;
      margin: 16px 16px 8px;
      padding: 14px 18px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .banner-text {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.35;
      max-width: 85%;
      color: #cbd5e1;
    }

    .banner-close {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #94a3b8;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .banner-close:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    main {
      padding: 16px 16px 40px;
      flex-grow: 1;
    }

    /* Карточка с заголовком */
    .header-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 22px 20px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 22px;
      line-height: 1.25;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .description {
      font-size: 14px;
      line-height: 1.45;
      color: var(--text-muted);
    }

    /* Карточки вопросов */
    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 20px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .optional-tag {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
    }

    select, input[type="text"], textarea {
      width: 100%;
      padding: 13px 16px;
      font-size: 14px;
      color: #f8fafc;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      background-color: var(--bg-input);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select option {
      background-color: #141b2d;
      color: #fff;
    }

    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 102, 245, 0.18);
    }

    input::placeholder, textarea::placeholder {
      color: #556584;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    /* Сетка оценок 0-10 */
    .rating-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-top: 4px;
    }

    .rating-btn {
      border: 1.5px solid var(--border-color);
      background: var(--bg-input);
      padding: 10px 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      color: var(--text-muted);
    }

    .rating-btn:hover {
      background-color: #232f4e;
      border-color: #3b507d;
      color: #fff;
    }

    .rating-btn.active {
      background-color: var(--primary-blue);
      border-color: var(--primary-blue);
      color: #fff;
      box-shadow: 0 0 10px rgba(59, 102, 245, 0.4);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      font-size: 15px;
      font-weight: 600;
      border-radius: var(--radius-pill);
      cursor: pointer;
      text-align: center;
      transition: transform 0.1s ease, background-color 0.2s ease;
      border: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary-blue);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-primary:disabled {
      background-color: #283759;
      color: #64748b;
      cursor: not-allowed;
    }

    .status-message {
      display: none;
      padding: 14px;
      margin-top: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
    }

    .status-success {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .status-error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="banner" id="banner">
      <div class="banner-text">Оцените направление</div>
      <button class="banner-close" onclick="document.getElementById('banner').style.display='none'">✕</button>
    </div>

    <main>
      <div class="header-card">
        <h1>Обучаем востребованных специалистов</h1>
        <p class="description">Помогите нам стать лучше — оставьте обратную связь по вашей специальности.</p>
      </div>

      <form id="feedbackForm">
        <!-- 1. ФИО (перемещено в начало) -->
        <div class="form-card">
          <label for="fio">Ваше ФИО <span class="optional-tag">(необязательно)</span></label>
          <input type="text" id="fio" placeholder="Иванов Иван Иванович">
        </div>

        <!-- 2. Выбор направления -->
        <div class="form-card">
          <label for="direction">Выберите направление *</label>
          <select id="direction" required>
            <option value="" disabled selected>Нажмите для выбора...</option>
            <option value="Программирование и ИТ">Программирование и ИТ</option>
            <option value="Робототехника и автоматизация">Робототехника и автоматизация</option>
            <option value="Электромонтаж и схемотехника">Электромонтаж и схемотехника</option>
            <option value="Лабораторный химический анализ">Лабораторный химический анализ</option>
            <option value="Бизнес и администрирование">Бизнес и администрирование</option>
          </select>
        </div>

        <!-- 3. Оценка от 0 до 10 -->
        <div class="form-card">
          <label>Оценка программы (от 0 до 10) *</label>
          <input type="hidden" id="score" name="score" required>
          <div class="rating-grid" id="ratingGrid"></div>
        </div>

        <!-- 4. Комментарий -->
        <div class="form-card">
          <label for="comment">Комментарий <span class="optional-tag">(необязательно)</span></label>
          <textarea id="comment" placeholder="Что вам нравится, а что стоит улучшить?"></textarea>
        </div>

        <div class="actions">
          <button type="submit" id="submitBtn" class="btn btn-primary">Отправить отзыв</button>
        </div>

        <div id="statusMessage" class="status-message"></div>
      </form>
    </main>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzjb0J7HdLFMN1IVM2hozpDrHU7rU3Hugg74KBtsyK2m8B5Zl-FB0VbH-Qy5EcaeHEK/exec';

    const ratingGrid = document.getElementById('ratingGrid');
    const scoreInput = document.getElementById('score');

    for (let i = 0; i <= 10; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'rating-btn';
      btn.textContent = i;
      btn.onclick = () => {
        document.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        scoreInput.value = i;
      };
      ratingGrid.appendChild(btn);
    }

    const form = document.getElementById('feedbackForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMessage');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      if (scoreInput.value === '') {
        alert('Пожалуйста, выберите оценку от 0 до 10.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Отправка...';
      statusMsg.style.display = 'none';

      const feedbackData = {
        direction: document.getElementById('direction').value,
        score: scoreInput.value,
        fio: document.getElementById('fio').value || 'Анонимно',
        comment: document.getElementById('comment').value || 'Без комментария',
        date: new Date().toLocaleString('ru-RU')
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(feedbackData)
        });

        statusMsg.className = 'status-message status-success';
        statusMsg.textContent = 'Спасибо! Ваш отзыв успешно сохранен!';
        statusMsg.style.display = 'block';

        form.reset();
        document.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
      } catch (err) {
        statusMsg.className = 'status-message status-error';
        statusMsg.textContent = 'Произошла ошибка при отправке. Попробуйте еще раз.';
        statusMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Отправить отзыв';
      }
    });
  </script>
</body>
</html>
