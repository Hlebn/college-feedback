<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Итоги военно-патриотических занятий</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #0b0f19;
      --bg-card: #141b2d;
      --bg-input: #1a233a;
      --primary-blue: #3b66f5;
      --primary-hover: #2d52d9;
      --text-main: #f1f5f9;
      --text-muted: #8e9bb2;
      --border-color: #263352;
      --border-focus: #3b66f5;
      --radius-pill: 9999px;
      --radius-card: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--bg-page);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      padding: 20px 16px 40px;
      flex-grow: 1;
    }

    .header-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 22px 20px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 20px;
      line-height: 1.35;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .description {
      font-size: 14px;
      line-height: 1.45;
      color: var(--text-muted);
    }

    /* Заголовки разделов */
    .section-header {
      margin: 28px 4px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-header h2 {
      font-size: 17px;
      font-weight: 800;
      color: #93c5fd;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, #263352 0%, transparent 100%);
    }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 18px;
      margin-bottom: 14px;
    }

    .direction-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rated-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(59, 102, 245, 0.2);
      color: #7094ff;
      display: none;
    }

    .optional-tag {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 13px;
      color: #f8fafc;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      background-color: var(--bg-input);
      transition: border-color 0.2s, box-shadow 0.2s;
      resize: vertical;
      min-height: 55px;
    }

    textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 102, 245, 0.18);
    }

    textarea::placeholder {
      color: #556584;
    }

    .rating-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }

    .rating-btn {
      border: 1.5px solid var(--border-color);
      background: var(--bg-input);
      padding: 9px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      color: var(--text-muted);
    }

    .rating-btn:hover {
      background-color: #232f4e;
      border-color: #3b507d;
      color: #fff;
    }

    .rating-btn.active {
      background-color: var(--primary-blue);
      border-color: var(--primary-blue);
      color: #fff;
      box-shadow: 0 0 8px rgba(59, 102, 245, 0.4);
    }

    .btn {
      width: 100%;
      padding: 15px;
      font-size: 15px;
      font-weight: 600;
      border-radius: var(--radius-pill);
      cursor: pointer;
      text-align: center;
      transition: transform 0.1s ease, background-color 0.2s ease;
      border: none;
      background-color: var(--primary-blue);
      color: #ffffff;
      margin-top: 10px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      background-color: #283759;
      color: #64748b;
      cursor: not-allowed;
    }

    .status-message {
      display: none;
      padding: 14px;
      margin-top: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
    }

    .status-success {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .status-error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
  </style>
</head>
<body>

  <div class="container">
    <main>
      <div class="header-card">
        <h1>Итоги военно-патриотических занятий</h1>
        <p class="description">Оцените пройденные дисциплины от 0 до 10 и поделитесь впечатлениями.</p>
      </div>

      <form id="feedbackForm">
        <div id="sectionsContainer"></div>

        <div class="form-card" style="margin-top: 24px;">
          <label style="font-size: 15px; margin-top: 0;" for="suggestions">Ваши пожелания / предложения <span class="optional-tag">(необязательно)</span></label>
          <textarea id="suggestions" placeholder="Что можно добавить или улучшить в программе в будущем?"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn">Отправить отзывы</button>
        <div id="statusMessage" class="status-message"></div>
      </form>
    </main>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzjb0J7HdLFMN1IVM2hozpDrHU7rU3Hugg74KBtsyK2m8B5Zl-FB0VbH-Qy5EcaeHEK/exec';

    const programSections = [
      {
        section: "Воинский рубеж",
        items: [
          "Руководитель",
          "ВДП (воздушно-десантная подготовка)",
          "Письмо солдату",
          "Тактическая медицина",
          "БПЛА",
          "Инженерная Подготовка"
        ]
      },
      {
        section: "Огневой рубеж",
        items: [
          "Разборка сборка",
          "ТИР",
          "Огневая подготовка / Метание учебных имитационных гранат",
          "Упражнение армейских тактических стрельб",
          "Радиационно Химическая Биологическая Защита"
        ]
      },
      {
        section: "Партизанская деревня",
        items: [
          "Клуб",
          "Хозяйственный двор",
          "Музейный комплекс",
          "Партизанский Штаб",
          "Расположение личного состава / Лазарет"
        ]
      },
      {
        section: "Тактическая игра (лазертаг)",
        items: [
          "Команда синих",
          "Команда красных"
        ]
      },
      {
        section: "Музей",
        items: [
          "Музей (г. Елабуга)"
        ]
      }
    ];

    const container = document.getElementById('sectionsContainer');
    const flatItemsList = [];
    const tacticalElements = [];
    let globalIndex = 0;

    programSections.forEach(sec => {
      const headerDiv = document.createElement('div');
      headerDiv.className = 'section-header';
      headerDiv.innerHTML = `<h2>${sec.section}</h2>`;
      container.appendChild(headerDiv);

      sec.items.forEach(itemName => {
        const currentIndex = globalIndex++;
        const card = document.createElement('div');
        card.className = 'form-card';
        card.innerHTML = `
          <div class="direction-title">
            <span>${itemName}</span>
            <span class="rated-badge" id="badge-${currentIndex}">Оценено</span>
          </div>
          <input type="hidden" id="score-${currentIndex}" value="">
          <div class="rating-grid" id="grid-${currentIndex}"></div>
          
          <label for="liked-${currentIndex}">Что понравилось:</label>
          <textarea id="liked-${currentIndex}" placeholder="Плюсы, интересные моменты"></textarea>
          
          <label for="disliked-${currentIndex}">Что не понравилось:</label>
          <textarea id="disliked-${currentIndex}" placeholder="Минусы, сложности, недочеты"></textarea>
        `;
        container.appendChild(card);

        const grid = card.querySelector(`#grid-${currentIndex}`);
        const hiddenInput = card.querySelector(`#score-${currentIndex}`);
        const badge = card.querySelector(`#badge-${currentIndex}`);

        flatItemsList.push({
          section: sec.section,
          name: itemName,
          index: currentIndex
        });

        if (sec.section.includes("Тактическая игра")) {
          tacticalElements.push({ card, hiddenInput, grid, badge });
        }

        for (let i = 0; i <= 10; i++) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'rating-btn';
          btn.textContent = i;
          btn.onclick = () => {
            if (hiddenInput.value === String(i)) {
              hiddenInput.value = '';
              btn.classList.remove('active');
              badge.style.display = 'none';
            } else {
              grid.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              hiddenInput.value = i;
              badge.style.display = 'inline-block';
            }
          };
          grid.appendChild(btn);
        }
      });
    });

    // Наблюдатель за скроллом для раздела лазертага
    if (tacticalElements.length > 0) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting && entry.boundingClientRect.bottom < 0) {
            const target = tacticalElements.find(t => t.card === entry.target);
            if (target && target.hiddenInput.value !== '' && target.hiddenInput.value !== '10') {
              const allButtons = target.grid.querySelectorAll('.rating-btn');
              const btn10 = allButtons[10];
              if (btn10) {
                allButtons.forEach(b => b.classList.remove('active'));
                btn10.classList.add('active');
                target.hiddenInput.value = '10';
                target.badge.style.display = 'inline-block';
              }
            }
          }
        });
      }, { threshold: 0 });

      tacticalElements.forEach(t => observer.observe(t.card));
    }

    const form = document.getElementById('feedbackForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMessage');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      tacticalElements.forEach(t => {
        if (t.hiddenInput.value !== '' && t.hiddenInput.value !== '10') {
          t.hiddenInput.value = '10';
        }
      });

      const ratings = [];
      flatItemsList.forEach(item => {
        const score = document.getElementById(`score-${item.index}`).value;
        const liked = document.getElementById(`liked-${item.index}`).value.trim();
        const disliked = document.getElementById(`disliked-${item.index}`).value.trim();

        if (score !== '' || liked !== '' || disliked !== '') {
          ratings.push({
            section: item.section,
            direction: item.name,
            score: score !== '' ? score : '—',
            liked: liked || '—',
            disliked: disliked || '—'
          });
        }
      });

      if (ratings.length === 0) {
        alert('Пожалуйста, оцените или прокомментируйте хотя бы одно занятие перед отправкой.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Отправка...';
      statusMsg.style.display = 'none';

      const payload = {
        suggestions: document.getElementById('suggestions').value || '—',
        items: ratings
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        statusMsg.className = 'status-message status-success';
        statusMsg.textContent = 'Спасибо! Все ваши отзывы успешно отправлены!';
        statusMsg.style.display = 'block';

        form.reset();
        document.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.rated-badge').forEach(b => b.style.display = 'none');
        document.querySelectorAll('input[type="hidden"]').forEach(input => input.value = '');
      } catch (err) {
        statusMsg.className = 'status-message status-error';
        statusMsg.textContent = 'Произошла ошибка при отправке. Попробуйте еще раз.';
        statusMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Отправить отзывы';
      }
    });
  </script>
</body>
</html>
